name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg (integration test)
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - name: Server build & test
        run: swift test
      - name: Kit build & test
        working-directory: Kit
        run: swift test

  kit-apple:
    name: Kit on Apple platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Kit tests (macOS)
        working-directory: Kit
        run: swift test
      - name: Kit build (iOS, tvOS, visionOS)
        working-directory: Kit
        run: |
          for platform in iOS tvOS visionOS; do
            xcodebuild build -scheme LumeRecorderKit -destination "generic/platform=$platform" -quiet
          done

  # Pushes are signed with the Developer ID certificate when the secrets exist;
  # release tags are also notarized and their DMG attached to the GitHub release (and
  # fail without the secrets). PRs build ad-hoc signed.
  mac-app:
    name: macOS app
    runs-on: macos-26
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - name: Require signing secrets for releases
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING != 'true'
        run: |
          echo "Release builds need MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID and NOTARY_ISSUER_ID" >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Import Developer ID certificate
        if: github.event_name == 'push' && env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Prepare notarization key
        if: env.IS_RELEASE == 'true'
        env:
          KEY_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      # ffmpeg takes the longest; it only changes with build-ffmpeg.sh.
      - uses: actions/cache@v4
        with:
          path: |
            MacApp/.build/ffmpeg-*/ffmpeg
            MacApp/.build/ffmpeg-*/*.txt
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('MacApp/scripts/build-ffmpeg.sh') }}
      - name: Build LumeRecorder.app + DMG (universal)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: MacApp/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LumeRecorder-macOS
          path: MacApp/dist/*.dmg
          if-no-files-found: error
      - name: Attach to GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          # Plus a version-less copy, so releases/latest/download/LumeRecorder.dmg
          # (linked from getlume.org/recorder) always serves the newest build.
          cp MacApp/dist/LumeRecorder-*.dmg "$RUNNER_TEMP/LumeRecorder.dmg"
          gh release upload "$GITHUB_REF_NAME" MacApp/dist/*.dmg "$RUNNER_TEMP/LumeRecorder.dmg" --clobber
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Each architecture builds natively (Swift under QEMU emulation takes hours
  # and kills the runner). Pushes and PRs build amd64 only; release tags build
  # both, push each by digest, and the `manifest` job joins them into one
  # multi-arch image.
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Skip arm64 outside releases
        id: gate
        run: echo "build=${{ matrix.arch == 'amd64' || startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.build == 'true'
      # The Swift toolchain image plus the build cache overflow the runner's
      # free disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest on tags)
        id: build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.IS_RELEASE == 'true' && 'type=image,name=ghcr.io/bilipp/lumerecorder,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch image
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bilipp/lumerecorder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/bilipp/lumerecorder@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/bilipp/lumerecorder:${{ steps.meta.outputs.version }}
