name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg (integration test)
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - name: Server build & test
        run: swift test
      - name: Kit build & test
        working-directory: Kit
        run: swift test

  kit-apple:
    name: Kit on Apple platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Kit tests (macOS)
        working-directory: Kit
        run: swift test
      - name: Kit build (iOS, tvOS, visionOS)
        working-directory: Kit
        run: |
          for platform in iOS tvOS visionOS; do
            xcodebuild build -scheme LumeRecorderKit -destination "generic/platform=$platform" -quiet
          done

  # Each architecture builds natively (Swift under QEMU emulation takes hours
  # and kills the runner). Pushes and PRs build amd64 only; release tags build
  # both, push each by digest, and the `manifest` job joins them into one
  # multi-arch image.
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Skip arm64 outside releases
        id: gate
        run: echo "build=${{ matrix.arch == 'amd64' || startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.build == 'true'
      # The Swift toolchain image plus the build cache overflow the runner's
      # free disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest on tags)
        id: build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.IS_RELEASE == 'true' && 'type=image,name=ghcr.io/bilipp/lumerecorder,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.build == 'true' && env.IS_RELEASE == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch image
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bilipp/lumerecorder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/bilipp/lumerecorder@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/bilipp/lumerecorder:${{ steps.meta.outputs.version }}
