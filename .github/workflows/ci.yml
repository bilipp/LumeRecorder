name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg (integration test)
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - name: Server build & test
        run: swift test
      - name: Kit build & test
        working-directory: Kit
        run: swift test

  kit-apple:
    name: Kit on Apple platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Kit tests (macOS)
        working-directory: Kit
        run: swift test
      - name: Kit build (iOS, tvOS, visionOS)
        working-directory: Kit
        run: |
          for platform in iOS tvOS visionOS; do
            xcodebuild build -scheme LumeRecorderKit -destination "generic/platform=$platform" -quiet
          done

  docker:
    name: Docker image
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Two Swift toolchain images plus the build cache overflow the runner's
      # ~14 GB free disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      # arm64 is emulated (QEMU) and slow, so the multi-arch image is only
      # built for release tags; pushes and PRs build amd64 to prove it builds.
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bilipp/lumerecorder
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
